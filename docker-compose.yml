version: '3.8'

services:
  db:
    image: mysql:5.7
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: apartments_laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
          test:
              - CMD
              - mysqladmin
              - ping
              - '-p${DB_PASSWORD}'
          retries: 3
          timeout: 5s

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"  # Changed from 8000:80 to match Laravel's default port
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    working_dir: /var/www/html


  frontend:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  db_data:

